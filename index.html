<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>LEI MAKANI</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
</style>
</head>
<body>
<video id="v" autoplay muted loop playsinline preload="auto" poster="poster.jpg" disablepictureinpicture disableremoteplayback></video>
<script>
(function(){
  var v=document.getElementById('v');
  var small=Math.max(screen.width,screen.height)*(window.devicePixelRatio||1)<=1440;
  v.src=small?'hero_720.mp4':'hero_1080.mp4';
  v.muted=true;
  function go(){var p=v.play();if(p&&p.catch)p.catch(function(){});}
  go();
  document.addEventListener('visibilitychange',function(){if(!document.hidden)go();});
  v.addEventListener('pause',function(){if(!document.hidden)go();});
})();
</script>
</body>
</html>
